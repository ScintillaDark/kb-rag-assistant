services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_INDEX_DIR: /app/data/index
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  ui:
    build: .
    command: ["python", "-m", "streamlit", "run", "ui/chat_app.py", "--server.headless", "true", "--server.address", "0.0.0.0", "--server.port", "8501"]
    env_file:
      - path: .env
        required: false
    environment:
      RAG_API_URL: http://api:8000/chat
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  ollama:
