[project]
name = "kb-rag-assistant"
version = "0.1.0"
description = "Local-first, offline RAG chatbot for any documentation set"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
